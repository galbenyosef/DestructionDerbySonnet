<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wreckyard</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b1226;
        --ink: #dfe7ff;
        --muted: #8fa0c8;
        --panel: rgba(13, 20, 42, 0.86);
        --line: rgba(160, 180, 255, 0.22);
        --accent: #ff7a1a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 12px;
        margin: 0;
        max-width: calc(100vw - 32px);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-shadow: 0 1px 2px #000;
        white-space: pre-wrap;
        pointer-events: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui button,
      #ui input {
        pointer-events: auto;
      }

      .menu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 28px 28px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        pointer-events: auto;
      }
      .menu h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0.18em;
        color: #fff;
      }
      .menu .tag {
        margin: 4px 0 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .menu label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .menu input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 10px 12px;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .menu input:focus-visible,
      .menu button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .swatches {
        display: flex;
        gap: 8px;
        margin: 14px 0;
      }
      .swatch {
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .swatch[aria-checked='true'] {
        border-color: #fff;
        box-shadow: 0 0 0 2px var(--accent);
      }
      .menu .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .menu .row input {
        flex: none;
        width: 110px;
        margin-top: 0;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }
      .menu button {
        flex: 1;
        padding: 11px 14px;
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      .menu button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a0d00;
      }
      .menu button:hover {
        filter: brightness(1.15);
      }
      .menu .error {
        min-height: 1.3em;
        margin: 12px 0 0;
        color: #ff8a8a;
        font-size: 13px;
      }
      .menu .hint {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hud [hidden] {
        display: none !important; /* panels that set their own display would otherwise ignore the attribute */
      }
      .hud-room {
        position: absolute;
        left: 16px;
        top: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
      }
      .hud-room button {
        padding: 3px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      .hud-round {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        min-width: 190px;
        padding: 6px 14px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
      }
      .hud-round-title {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .hud-round-clock {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-round-alive {
        color: var(--muted);
        font-size: 12px;
      }
      .hud-board {
        position: absolute;
        right: 16px;
        top: 12px;
        min-width: 190px;
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
      }
      .hud-board.detailed {
        min-width: 300px;
      }
      .hud-board .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .hud-board .row.you {
        color: var(--accent);
        font-weight: 700;
      }
      .hud-board .row.out {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .hud-board .rank {
        width: 1.2em;
        color: var(--muted);
        text-align: right;
      }
      .hud-board .chip {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .hud-board .name {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .hud-board .stat {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .hud-board .score {
        min-width: 2.6em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .hud-feed {
        position: absolute;
        right: 16px;
        top: 190px;
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: right;
        font-size: 13px;
        text-shadow: 0 1px 3px #000;
      }
      .hud-feed li {
        margin-top: 3px;
      }
      .hud-feed .feed-mine {
        color: #7dff9b;
        font-weight: 700;
      }
      .hud-feed .feed-theirs {
        color: #ff8a8a;
        font-weight: 700;
      }
      .hud-bottom {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .hud-me {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .hud-zones {
        display: grid;
        grid-template: 12px 22px 12px / 12px 22px 12px;
        gap: 2px;
      }
      .hud-zones .zone {
        border-radius: 3px;
      }
      .hud-zones .zone-front {
        grid-area: 1 / 2;
      }
      .hud-zones .zone-left {
        grid-area: 2 / 1;
      }
      .hud-zones .zone-right {
        grid-area: 2 / 3;
      }
      .hud-zones .zone-rear {
        grid-area: 3 / 2;
      }
      .hud-zones .zone-car {
        grid-area: 2 / 2;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.35);
      }
      .hud-hp {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hp-bar {
        width: 200px;
        height: 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .hp-fill {
        height: 100%;
        width: 100%;
        transition: width 120ms linear;
      }
      .hp-num {
        min-width: 2.4em;
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-speed {
        min-width: 5.5em;
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .hud-banner {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translate(-50%, -50%);
        text-align: center;
        text-shadow: 0 2px 8px #000;
      }
      .banner-title {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 1;
      }
      .hud-banner[data-kind='go'] .banner-title {
        color: #7dff9b;
      }
      .hud-banner[data-kind='out'],
      .hud-banner[data-kind='watching'] {
        top: 17%; /* higher than the big banners: the name of the car being followed sits near the middle of the screen */
      }
      .hud-banner[data-kind='out'] .banner-title,
      .hud-banner[data-kind='watching'] .banner-title {
        font-size: 40px;
      }
      .hud-banner[data-kind='results'] .banner-title {
        font-size: 52px;
        color: var(--accent);
      }
      .banner-sub {
        margin-top: 8px;
        font-size: 18px;
        color: var(--ink);
      }
      .banner-hint {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .hud-flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0) 45%, rgba(255, 30, 30, 0.7) 100%);
      }
      .hud-stats {
        position: absolute;
        left: 16px;
        bottom: 12px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        text-shadow: 0 1px 2px #000;
      }
      .hud-notice {
        font-size: 15px;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="hud"></pre>
    <div id="ui"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
